[project]
name = "slimseek"
version = "0.1.0"
description = "A lightweight, self-hosted RAG knowledge retrieval system with SQLite vector search, source citations, OpenAI-compatible APIs, and Ollama"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.7,<3",
    "pypdf>=5,<7",
    "python-multipart>=0.0.20,<1",
    "sqlite-vec>=0.1.6,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
slimseek = "slimseek.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slimseek"]
